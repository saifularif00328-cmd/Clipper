name: Build Clipper.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Download ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/ffmpeg | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe, ffmpeg_tmp/*/bin/ffprobe.exe assets/ffmpeg/
      - name: Build exe
        run: pyinstaller clipper.spec --noconfirm --clean
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Clipper -DestinationPath Clipper-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Clipper-windows
          path: Clipper-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Clipper-windows.zip
